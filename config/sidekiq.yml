:concurrency: 5

:schedule:
  refresh_engagement_levels:
    cron: "0 2 * * *"
    class: "RefreshEngagementLevelsJob"
    queue: default
    description: "Refresh engagement levels materialized view daily at 2am"

  reconcile_unread_messages_counts:
    cron: "*/15 * * * *"
    class: "ReconcileUnreadMessagesCountsJob"
    queue: default
    description: "Safety net: re-trigger UnreadChatMessageJob for conversations with recent activity, in case a run was lost"
